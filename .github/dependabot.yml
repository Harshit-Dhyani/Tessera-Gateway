version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: chore(actions)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
    commit-message:
      prefix: chore(deps)
    groups:
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vitest"
